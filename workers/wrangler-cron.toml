# Config del worker de cron (katy-cron) — separado del wrangler.toml de la web
# (que es el proyecto de Pages). Existe desde el 06/08/2026: el cron dejó de
# ejecutarse el 05/08 (las citas del 06 quedaron sin notificar) y el worker
# vivía solo en el dashboard, subido a mano — sin trigger declarado en el repo
# ni forma de redesplegarlo reproduciblemente. Con esto:
#
#   npx wrangler deploy --config workers/wrangler-cron.toml
#
# restaura código Y programación de una vez. Los secretos (VAPID_*) viven en el
# worker y sobreviven a los deploys.

name = "katy-cron"
main = "cron.ts"
compatibility_date = "2024-12-01"

# 10:00 UTC = 12:00 en Madrid en verano, 11:00 en invierno — la hora de toda
# la vida de los recordatorios de Katty.
[triggers]
crons = ["0 10 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "katy-clinica"
database_id = "209b7ac3-76b3-4293-aa1c-f1de5bf3c573"
